name: Cask checks

on:
  push:
    branches:
      - cask-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Show Homebrew
        run: brew --version

      - name: Style
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          brew style --fix Casks/l/lap.rb
          git diff -- Casks/l/lap.rb
          git diff --exit-code -- Casks/l/lap.rb

      - name: Audit new cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --cask --new Casks/l/lap.rb

      - name: Install
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: brew install --cask Casks/l/lap.rb

      - name: Uninstall
        run: brew uninstall --cask lap
