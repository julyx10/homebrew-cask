name: Cask checks

on:
  push:
    branches:
      - cask-test
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: cask-test

      - name: Verify cask file
        run: |
          pwd
          git branch --show-current
          test -f Casks/l/lap.rb
          ls -la Casks/l

      - name: Update Homebrew
        run: brew update --force

      - name: Check cask style
        run: |
          brew style --fix Casks/l/lap.rb
          if ! git diff --exit-code -- Casks/l/lap.rb; then
            echo "::error::brew style changed Casks/l/lap.rb; review and commit the formatting changes"
            exit 1
          fi

      - name: Create local tap
        run: |
          brew tap-new lap/test
          TAP_PATH="$(brew --repository lap/test)"
          mkdir -p "$TAP_PATH/Casks/l"
          cp Casks/l/lap.rb "$TAP_PATH/Casks/l/lap.rb"
          ls -la "$TAP_PATH/Casks/l"

      - name: Trust local tap cask
        run: brew trust --cask lap/test/lap

      - name: Audit new cask
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: brew audit --cask --new lap/test/lap

      - name: Install cask
        env:
          HOMEBREW_NO_INSTALL_FROM_API: "1"
        run: brew install --cask lap/test/lap

      - name: Uninstall cask
        run: brew uninstall --cask lap/test/lap
